        tools: "Student Information System (SIS), LMS Portal, Biometric Attendance, Exam Proctoring Logs",
        bottleneck: "Student admissions document verification, semester exam invigilation protocol, and accreditation audit record archiving.",
        remarks: "Use simple step-by-step instructions for faculty and admin staff with clear registrar sign-off gates."
      }
    };

    function loadPreset(key) {
      const p = PRESETS[key];
      document.getElementById("companyName").value = p.company;
      document.getElementById("sector").value = p.sector;
      document.getElementById("standard").value = p.standard;
      document.getElementById("tools").value = p.tools;
      document.getElementById("bottleneck").value = p.bottleneck;
      document.getElementById("remarks").value = p.remarks;
    }

    document.getElementById("sopForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (BACKEND_URL.includes("PASTE_YOUR")) {
        alert("Please paste your Google Apps Script Web App URL into BACKEND_URL inside index.html first.");
        return;
      }

      document.getElementById("generateBtn").disabled = true;
      document.getElementById("loadingSpinner").style.display = "block";

      const payload = {
        action: "generate",
        companyName: document.getElementById("companyName").value.trim(),
        sector: document.getElementById("sector").value,
        standard: document.getElementById("standard").value,
        tools: document.getElementById("tools").value.trim(),
        bottleneck: document.getElementById("bottleneck").value.trim(),
        remarks: document.getElementById("remarks").value.trim()
      };

      try {
        const res = await fetch(BACKEND_URL, { method: "POST", body: JSON.stringify(payload) });
        const data = await res.json();
        if (data.success) {
          currentRecordId = data.recordId;
          renderPreview(data);
        } else {
          alert("Error generating SOP: " + (data.error || "Please try again."));
        }
      } catch (err) {
        alert("Network error connecting to SOP Engine. Please verify your Web App deployment.");
      } finally {
        document.getElementById("generateBtn").disabled = false;
        document.getElementById("loadingSpinner").style.display = "none";
      }
    });

    function renderPreview(data) {
      document.getElementById("intakeCard").style.display = "none";
      document.getElementById("previewSection").style.display = "block";
      document.getElementById("sopOutputContainer").innerHTML = data.sopHtml;
      document.getElementById("scoreBadge").textContent = "Verified Audit Score: " + data.complianceScore + "/100";
      document.getElementById("revBadge").textContent = "READ-ONLY PREVIEW • Revision " + data.revisionCount + " of 3";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openRevisionDrawer() {
      document.getElementById("revisionDrawer").style.display = "block";
    }

    async function submitRevision() {
      const notes = document.getElementById("revisionNotes").value.trim();
      if (!notes) return alert("Please enter what you would like modified.");
      document.getElementById("revSpinner").style.display = "block";

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          body: JSON.stringify({ action: "revise", recordId: currentRecordId, notes: notes })
        });
        const data = await res.json();
        if (data.limitReached) {
          alert("Maximum 3 automated revisions reached. Click 'Access My SOP' to open your SOP in ClickUp!");
        } else if (data.success) {
          document.getElementById("revisionDrawer").style.display = "none";
          document.getElementById("revisionNotes").value = "";
          renderPreview(data);
        }
      } catch (err) {
        alert("Error updating SOP. Please try again.");
      } finally {
        document.getElementById("revSpinner").style.display = "none";
      }
    }

    async function approveAndUnlock() {
      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          body: JSON.stringify({ action: "approve", recordId: currentRecordId })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("decisionButtons").style.display = "none";
          document.getElementById("revisionDrawer").style.display = "none";
          document.getElementById("unlockedCard").style.display = "block";
          document.getElementById("clickupLink").href = data.clickupUrl;
          document.getElementById("gumroadLink").href = data.gumroadUrl;
          document.getElementById("qrCodeImg").src = "https://qrserver.com" + encodeURIComponent(window.location.href);
        }
      } catch (err) {
        alert("Error unlocking workspace link. Please try again.");
      }
    }
  </script>
</body>
</html>
